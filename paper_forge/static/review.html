<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper Forge review</title>
<style>
:root{--bg:#f6f7f9;--surface:#fff;--fg:#14181f;--muted:#5b6472;--line:#dde1e8;--accent:#2556d9;--ok:#1a7f4b;--ok-soft:#e3f4ea;--warn:#9a6200;--warn-soft:#fdf1d6;--bad:#b3261e;--bad-soft:#fbe4e2;--info-soft:#e5ecfd;--e:#2e9e6a;--m:#d99a1e;--h:#d2483e}
@media (prefers-color-scheme:dark){:root{--bg:#0f1216;--surface:#171b21;--fg:#e8ebf0;--muted:#98a1b0;--line:#2a313b;--accent:#7ca0ff;--ok:#5fd09a;--ok-soft:#14301f;--warn:#f0b955;--warn-soft:#33270f;--bad:#ff8a80;--bad-soft:#3a1a18;--info-soft:#1a2644}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 Inter,system-ui,Segoe UI,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 120px}
h1{font:600 22px/1.2 "Space Grotesk",Inter,system-ui,sans-serif;margin:0 0 4px}
.muted{color:var(--muted)} .mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
select,button{font:inherit;color:inherit}
select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:100%}
button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--info-soft);margin-left:4px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.Easy .dot{background:var(--e)} .Medium .dot{background:var(--m)} .Hard .dot{background:var(--h)}
h2{font:600 16px/1.3 "Space Grotesk",Inter,sans-serif;margin:22px 0 2px}
details.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin:8px 0}
details.q>summary{list-style:none;cursor:pointer;padding:10px 14px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
details.q>summary::-webkit-details-marker{display:none}
.qt{white-space:pre-wrap;min-width:0;overflow-wrap:anywhere}
.body{padding:0 14px 12px}
.opts div{padding:3px 8px;border-radius:6px;overflow-wrap:anywhere} .opts .ans{background:var(--ok-soft);color:var(--ok);font-weight:600}
.ev{margin-top:8px;font-size:13px;color:var(--muted)} .ev b{color:var(--fg)}
.editor{margin-top:8px;padding:10px;border:1px dashed var(--line);border-radius:8px}
.editor label{margin-right:16px;white-space:nowrap}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-left));z-index:5}
.bar .in{max-width:900px;margin:0 auto;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.split{display:flex;height:18px;border-radius:5px;overflow:hidden;background:var(--line);font-size:11px;color:#fff;min-width:160px;flex:1}
.split span{display:flex;align-items:center;justify-content:center}
.msg{white-space:pre-wrap}
</style>
</head>
<body>
<div class="wrap">
  <div class="row">
    <div><h1>Paper Forge review</h1><div class="muted" id="sub">Choose a draft paper</div></div>
    <select id="draft" aria-label="Draft paper"></select>
  </div>
  <div id="empty" class="card" hidden>No drafts yet. Run <span class="mono">python -m paper_forge generate ...</span> first.</div>
  <div id="head"></div>
  <div id="result"></div>
  <div id="list"></div>
</div>
<div class="bar"><div class="in">
  <div><b id="pendTxt">No changes pending</b><div class="muted" id="pendSub" style="font-size:13px">Press Edit on a question and pick Easy, Medium or Hard. Nothing changes until you press Generate.</div></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <button class="primary" id="gen" disabled>Generate changes</button>
    <button id="pdf" disabled>Download question paper PDF</button>
  </div>
</div></div>

<script>
(function(){
  var $=function(s){return document.querySelector(s)};
  var cur=null, pending={}, busy=false;
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function api(path,opt){return fetch(path,opt).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||r.statusText);return j})})}
  function usd(x){return '$'+(+x||0).toFixed(2)}

  function bar(sp){
    if(!sp)return '';
    var t=(sp.Easy||0)+(sp.Medium||0)+(sp.Hard||0)||1;
    return '<div class="split">'+[['Easy','e'],['Medium','m'],['Hard','h']].map(function(l){var n=sp[l[0]]||0;
      return '<span style="width:'+(n/t*100)+'%;background:var(--'+l[1]+')">'+(n?n:'')+'</span>'}).join('')+'</div>';
  }
  function head(v){
    var vd=v.validator;
    $('#sub').textContent=v.title+' · '+v.totalMarks+' marks · '+v.minutes+' min';
    $('#head').innerHTML='<div class="card"><div class="row"><div>Difficulty '+esc(v.difficulty)+
      (vd?(!vd.ran?' <span class="pill warn">Repo validator not run</span>':vd.ok?' <span class="pill ok">Repo validator passed</span>':' <span class="pill bad">Repo validator failed</span>'):'')+
      (v.needsHuman?' <span class="pill bad">'+v.needsHuman+' need a human</span>':'')+
      (v.pendingImageSection?' <span class="pill warn">Image section pending (developer task)</span>':'')+
      '</div><div class="muted">Cost '+usd(v.costUsd)+(v.editsCostUsd?' + edits '+usd(v.editsCostUsd):'')+'</div></div>'+
      '<div class="row" style="margin-top:8px"><span class="muted" style="width:72px">Requested</span>'+bar(v.requested)+'</div>'+
      '<div class="row" style="margin-top:4px"><span class="muted" style="width:72px">Delivered</span>'+bar(v.delivered)+'</div></div>';
  }
  function statusPill(s){return '<span class="pill '+(s==='Original'?'ok':'warn')+'">'+esc(s)+'</span>'}
  function evidence(q){
    var e=q.evidence,h='<div class="ev"><b>Explanation</b><br><span class="qt">'+esc(q.explanation)+'</span>';
    if(e){
      if(e.repo)h+='<br><b>Repo check</b> '+Math.round((e.repo.maxRepoSimilarity||0)*100)+'% similar to the closest existing question'+(e.repo.fingerprintCollision?' (same structure found)':'');
      if(e.web)h+='<br><b>Web check</b> '+esc(e.web.verdict)+(e.web.url?' · '+esc(e.web.url):'');
      if(e.rating)h+='<br><b>Difficulty</b> '+esc(e.rating.label)+' · about '+esc(e.rating.expectedSeconds)+' s · '+esc((e.rating.rulesHit||[]).join(', '))+' · '+esc(e.rating.reason);
      if(e.attempts>1)h+='<br><b>Attempts</b> '+e.attempts;
      if(e.flag)h+='<br><b>Flag</b> '+esc(e.flag);
    }
    return h+'</div>';
  }
  function codingHtml(s){
    return '<h2>'+esc(s.name)+' <span class="pill">Coding</span></h2><div class="muted" style="font-size:13px">'+esc(s.instructions)+
      ' Coding problems cannot be edited here yet.</div>'+s.problems.map(function(p){
      return '<details class="q"><summary><div class="qt"><b>'+esc(p.title)+'</b></div><div style="white-space:nowrap"><span class="pill '+
        ({EASY:'Easy',MEDIUM:'Medium',HARD:'Hard'}[p.difficulty]||'')+'"><i class="dot"></i>'+esc(p.difficulty)+'</span><span class="pill">'+p.marks+' marks</span>'+
        (p.flag?'<span class="pill warn">'+esc(p.flag.slice(0,40))+'</span>':'')+'</div></summary><div class="body"><pre class="qt" style="margin:0;font:inherit">'+esc(p.statement)+'</pre>'+
        (p.evidence?'<div class="ev"><b>Checks</b> brute force timed out at max size: '+esc(p.evidence.bruteTimedOutAtMax)+' · reference slowest '+esc(p.evidence.referenceSlowestSeconds)+' s'+
          (p.evidence.repo?' · statement similarity '+Math.round((p.evidence.repo.maxStatementSimilarity||0)*100)+'%':'')+
          (p.evidence.web?' · web: '+esc(p.evidence.web.verdict):'')+(p.evidence.rating?' · rated '+esc(p.evidence.rating.label):'')+'</div>':'')+'</div></details>';
    }).join('');
  }
  function speakingHtml(s){
    return '<h2>'+esc(s.name)+' <span class="pill">Speaking · '+esc(s.mode)+'</span></h2><div class="muted" style="font-size:13px">'+esc(s.instructions)+
      ' Speaking items cannot be edited here yet.</div>'+s.items.map(function(it){
      return '<details class="q"><summary><div class="qt"><b>'+esc(it.title)+'</b></div><div style="white-space:nowrap"><span class="pill '+it.complexity+
        '"><i class="dot"></i>'+esc(it.complexity)+'</span><span class="pill">'+it.marks+' marks</span></div></summary><div class="body"><div class="qt">'+esc(it.prompt)+
        '</div>'+(it.hasAudio?'<div class="ev"><b>Audio</b> '+(it.audioAsset?esc(it.audioAsset):'<span class="pill warn">waiting for the dev team URL (null)</span>')+'</div>':'')+
        '<div class="ev"><b>Model answer</b><br><span class="qt">'+esc(it.modelAnswer||'')+'</span></div></div></details>';
    }).join('');
  }
  function writingHtml(s){
    return '<h2>'+esc(s.name)+' <span class="pill">Writing</span></h2><div class="muted" style="font-size:13px">'+esc(s.instructions)+
      ' Writing tasks cannot be edited here yet.</div>'+s.items.map(function(it,i){
      return '<details class="q"><summary><div class="qt"><b>'+(i+1)+'.</b> '+esc(it.prompt)+'</div><div style="white-space:nowrap"><span class="pill '+it.complexity+
        '"><i class="dot"></i>'+esc(it.complexity)+'</span><span class="pill">'+esc(it.type)+'</span><span class="pill">'+it.wordLimit.min+'-'+it.wordLimit.max+' words</span><span class="pill">'+it.marks+' marks</span></div></summary><div class="body">'+
        '<div class="ev"><b>Rubric</b><br>'+it.criteria.map(function(c){return '- '+esc(c)}).join('<br>')+'</div>'+
        '<div class="ev"><b>Model answer</b><br><span class="qt">'+esc(it.modelAnswer||'')+'</span></div></div></details>';
    }).join('');
  }
  function render(v){
    cur=v; head(v);
    $('#list').innerHTML=v.sections.map(function(s){
      if(s.kind==='CODING')return codingHtml(s);
      if(s.kind==='SPEAKING')return speakingHtml(s);
      if(s.kind==='WRITING')return writingHtml(s);
      var ed=s.editable!==false;
      return '<h2>'+esc(s.name)+(ed?'':' <span class="pill">Audio</span>')+'</h2><div class="muted" style="font-size:13px">'+esc(s.instructions)+
      (ed?'':' Questions tied to a recording cannot be edited here yet.')+'</div>'+
      (s.audio?'<div class="ev"><b>Audio file</b> '+(s.audio.url?esc(s.audio.url):'<span class="pill warn">waiting for the dev team URL (null)</span>')+'<br><b>Script</b><br><span class="qt">'+esc(s.audio.transcript)+'</span></div>':'')+
      s.questions.map(function(q){
        var pend=pending[q.questionKey];
        return '<details class="q" open data-k="'+esc(q.questionKey)+'"><summary><div class="qt"><b>'+q.number+'.</b> '+esc(q.question)+'</div>'+
          '<div style="white-space:nowrap"><span class="pill '+q.complexity+'"><i class="dot"></i>'+q.complexity+'</span>'+statusPill(q.status)+
          '<span class="pill" data-pend="'+esc(q.questionKey)+'"'+(pend?'':' hidden')+'>Pending: '+esc(pend||'')+'</span></div></summary>'+
          '<div class="body"><div class="opts">'+['A','B','C','D'].map(function(l){return '<div class="'+(l===q.correctAnswer?'ans':'')+'">'+l+'. '+esc(q.options[l])+(l===q.correctAnswer?' ✓':'')+'</div>'}).join('')+'</div>'+
          (ed?'<div style="margin-top:8px"><button data-edit="'+esc(q.questionKey)+'">Edit</button></div>':'')+
          (ed?'<div class="editor" data-ed="'+esc(q.questionKey)+'" hidden><b>Change difficulty</b><div style="margin-top:6px">'+
          ['Easy','Medium','Hard'].map(function(l){return '<label><input type="radio" name="lv-'+esc(q.questionKey)+'" value="'+l+'"'+((pend||q.complexity)===l?' checked':'')+'> '+l+(l===q.complexity?' (current)':'')+'</label>'}).join('')+
          '</div><div class="muted" style="font-size:13px;margin-top:6px">Choosing a level only marks it. The question is rewritten at that level when you press Generate.</div></div>'+
          evidence(q)+'</div></details>';
      }).join('');
    }).join('');
    $('#list').querySelectorAll('[data-edit]').forEach(function(b){b.addEventListener('click',function(){
      var ed=$('#list [data-ed="'+b.dataset.edit+'"]');ed.hidden=!ed.hidden;b.textContent=ed.hidden?'Edit':'Close editor'})});
    $('#list').querySelectorAll('input[type=radio]').forEach(function(r){r.addEventListener('change',function(){
      var k=r.name.slice(3), q=find(k);
      if(r.value===q.complexity)delete pending[k];else pending[k]=r.value;
      var p=$('#list [data-pend="'+k+'"]');p.hidden=!pending[k];p.textContent='Pending: '+(pending[k]||'');upd()})});
    upd();
  }
  function find(k){var r=null;cur.sections.forEach(function(s){s.questions.forEach(function(q){if(q.questionKey===k)r=q})});return r}
  function upd(){
    var n=Object.keys(pending).length;
    $('#pendTxt').textContent=busy?'Rewriting with Claude...':(n?n+(n===1?' change':' changes')+' pending':'No changes pending');
    $('#pendSub').textContent=busy?'Each question is rewritten, then checked for originality and difficulty again.':
      (n?'Estimated cost about '+usd(n*0.07)+' ('+n+' x about $0.07). Press Generate to apply.':'Press Edit on a question and pick Easy, Medium or Hard. Nothing changes until you press Generate.');
    $('#gen').disabled=busy||!n; $('#pdf').disabled=busy||!!n||!cur;
    $('#pdf').title=n?'Press Generate first so your edits are in the PDF':'';
  }
  function load(key){
    pending={}; $('#result').innerHTML='';
    return api('/api/paper?key='+encodeURIComponent(key)).then(render).catch(function(e){$('#list').innerHTML='<div class="card"><span class="pill bad">Error</span> '+esc(e.message)+'</div>'});
  }
  $('#gen').addEventListener('click',function(){
    if(busy)return; busy=true; upd();
    api('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:cur.key,changes:pending})})
    .then(function(r){
      pending={}; busy=false; render(r.view);
      $('#result').innerHTML='<div class="card"><b>Done.</b> Spent '+usd(r.spentUsd)+' this time, '+usd(r.sessionSpentUsd)+' this session.<div class="msg" style="margin-top:6px">'+
        r.results.map(function(x){return '<div><span class="pill '+(x.ok?'ok':'bad')+'">'+(x.ok?'OK':'Not changed')+'</span> '+esc(x.questionKey)+': '+esc(x.message)+'</div>'}).join('')+'</div></div>';
    }).catch(function(e){busy=false;upd();$('#result').innerHTML='<div class="card"><span class="pill bad">Failed</span> '+esc(e.message)+'</div>'});
  });
  $('#pdf').addEventListener('click',function(){ if(cur)window.location='/api/pdf?key='+encodeURIComponent(cur.key) });
  $('#draft').addEventListener('change',function(){load(this.value)});
  api('/api/drafts').then(function(d){
    if(!d.drafts.length){$('#empty').hidden=false;$('#draft').hidden=true;return}
    $('#draft').innerHTML=d.drafts.map(function(k){return '<option>'+esc(k)+'</option>'}).join('');
    load(d.drafts[0]);
  });
})();
</script>
</body>
</html>
